<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento Odontológico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Fundo suave sem imagem */
    body { 
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      display: flex; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px; 
    }

    /* Caixa principal */
    .container { 
      width: 100%; 
      max-width: 420px; 
      background: #ffffff;
      border-radius: 16px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.08); 
      padding: 24px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      min-height: 520px; 
    }
    
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; }
    .header p { font-size: 15px; color: #555; }
    .options { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
    
    /* Botões */
    .btn { 
      background: #ffffff; 
      border: 1.5px solid #007aff; 
      color: #007aff; 
      padding: 16px 18px; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 600; 
      text-align: left; 
      cursor: pointer; 
      transition: 0.15s ease; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      text-decoration: none; 
    }
    .btn:active { background: #007aff; color: #fff; transform: scale(0.98); }
    .btn-urgent { border-color: #d93025; color: #d93025; }
    .btn-urgent:active { background: #d93025; color: #fff; }
    .btn-back { margin-top: 16px; background: transparent; border: none; color: #666; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; padding: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <div class="header">
        <h1 id="title">Bem-vindo(a)!</h1>
        <p id="subtitle">Carregando...</p>
      </div>
      <div id="options-container" class="options"></div>
    </div>
    <button id="btn-back" class="btn-back" style="display: none;" onclick="goBack()">← Voltar</button>
  </div>

  <script>
    /* =======================================================
       ÁREA ADMINISTRÁVEL
       ======================================================= */
    const WHATSAPP_NUMERO = "5548999700481"; // DDD + Número (Verifique se o DDD 58 está correto)

    const FLUXO = {
      // TELA INICIAL
      inicio: {
        titulo: "Como podemos ajudar hoje?",
        subtitulo: "Escolha a opção que melhor descreve seu momento:",
        opcoes: [
          { texto: "🔴 Estou com dor ou urgência", whatsMsg: "URGÊNCIA: Olá! Estou com dor / quebrei um dente e preciso de atendimento o mais rápido possível.", urgente: true },
          { texto: "👤 Já sou paciente", proximo: "paciente" },
          { texto: "✨ É minha primeira vez aqui", proximo: "novo" }
        ]
      },

      // SUBMENUS
      paciente: {
        titulo: "Que bom ter você de volta!",
        subtitulo: "O que você precisa hoje?",
        opcoes: [
          { texto: "Agendar retorno ou manutenção", whatsMsg: "Olá! Já sou paciente e gostaria de agendar meu retorno/manutenção." },
          { texto: "Problema com meu tratamento atual", whatsMsg: "Olá! Sou paciente e tive um imprevisto com meu tratamento/aparelho. Gostaria de uma avaliação." },
          { texto: "Limpeza de rotina", whatsMsg: "Olá! Já sou paciente e quero agendar minha limpeza de rotina para manter a saúde em dia." }
        ]
      },
      
      novo: {
        titulo: "Seja muito bem-vindo(a)!",
        subtitulo: "Qual o seu principal objetivo conosco?",
        opcoes: [
          { texto: "Transformar meu sorriso (Estética)", whatsMsg: "Olá! Conheci o trabalho pelo Instagram. Tenho interesse em melhorar a estética do meu sorriso e quero entender as opções. Como funciona a primeira consulta?" },
          { texto: "Repor dentes perdidos (Implantes)", whatsMsg: "Olá! Conheci o consultório pelo Instagram. Gostaria de saber mais sobre a reposição de dentes e agendar uma avaliação inicial." },
          { texto: "Check-up preventivo e limpeza", whatsMsg: "Olá! Gostaria de agendar uma primeira consulta para um check-up geral e limpeza." }
        ]
      }
    };

    /* =======================================================
       LÓGICA DO MENU
       ======================================================= */
    let historicoNavegacao = [];
    let telaAtual = "inicio";

    function renderizar(telaKey) {
      const etapa = FLUXO[telaKey];
      document.getElementById("title").innerText = etapa.titulo;
      document.getElementById("subtitle").innerText = etapa.subtitulo;

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      etapa.opcoes.forEach(opcao => {
        const btn = document.createElement("button");
        btn.className = `btn ${opcao.urgente ? "btn-urgent" : ""}`;
        btn.innerHTML = `<span>${opcao.texto}</span> <span>→</span>`;

        btn.onclick = () => {
          if (opcao.proximo) {
            historicoNavegacao.push(telaKey);
            telaAtual = opcao.proximo;
            renderizar(telaAtual);
          } else if (opcao.whatsMsg) {
            // Usa a mensagem de marketing estratégica pronta para enviar
            const link = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(opcao.whatsMsg)}`;
            window.location.href = link;
          }
        };
        container.appendChild(btn);
      });

      document.getElementById("btn-back").style.display = historicoNavegacao.length > 0 ? "block" : "none";
    }

    function goBack() {
      if (historicoNavegacao.length > 0) {
        telaAtual = historicoNavegacao.pop();
        renderizar(telaAtual);
      }
    }

    renderizar("inicio");
  </script>
</body>
</html>
